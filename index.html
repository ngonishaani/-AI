<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(function () {
  var LAT = -18.9281, LNG = 29.8149, ZOOM = 15;
  function mount(el) {
    if (!window.L || el.dataset.ready === "1") return;
    var canvas = el.querySelector(".map-canvas") || el;
    if (canvas === el) {
      el.innerHTML = "";
      canvas = document.createElement("div");
      canvas.className = "map-canvas";
      el.appendChild(canvas);
    }
    el.dataset.ready = "1";
    try {
      var map = L.map(canvas, { scrollWheelZoom: false }).setView([LAT, LNG], ZOOM);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap"
      }).addTo(map);
      L.marker([LAT, LNG]).addTo(map).bindPopup("Trade Square Mall · Kwekwe");
      setTimeout(function () { map.invalidateSize(); }, 250);
      window.addEventListener("resize", function () { map.invalidateSize(); });
    } catch (err) {
      el.dataset.ready = "0";
      el.innerHTML = '<div class="map-fallback"><a href="https://www.google.com/maps/search/?api=1&query=Trade%20Square%20Mall%2C%20Kwekwe%2C%20Zimbabwe" target="_blank" rel="noreferrer">Open Trade Square Mall on Google Maps →</a></div>';
    }
  }
  function scan() {
    document.querySelectorAll('[data-map="tradesquare"]').forEach(mount);
  }
  var obs = new MutationObserver(scan);
  obs.observe(document.documentElement, { childList: true, subtree: true });
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", scan);
  else scan();
})();
</script>
