<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(function () {
  var LAT = -18.9281, LNG = 29.8149, ZOOM = 15;
  function mount(el) {
    if (!window.L || el.dataset.ready === "1") return;
    var canvas = el.querySelector(".map-canvas") || el;
    if (canvas === el) {
      el.innerHTML = "";
      canvas = document.createElement("div");
      canvas.className = "map-canvas";
      el.appendChild(canvas);
    }
    el.dataset.ready = "1";
    try {
      var map = L.map(canvas, { scrollWheelZoom: false }).setView([LAT, LNG], ZOOM);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap"
      }).addTo(map);
      L.marker([LAT, LNG]).addTo(map).bindPopup("Trade Square Mall · Kwekwe");
      setTimeout(function () { map.invalidateSize(); }, 250);
      window.addEventListener("resize", function () { map.invalidateSize(); });
    } catch (err) {
      el.dataset.ready = "0";
      el.innerHTML = '<div class="map-fallback"><a href="https://www.google.com/maps/search/?api=1&query=Trade%20Square%20Mall%2C%20Kwekwe%2C%20Zimbabwe" target="_blank" rel="noreferrer">Open Trade Square Mall on Google Maps →</a></div>';
    }
  }
  function scan() {
    document.querySelectorAll('[data-map="tradesquare"]').forEach(mount);
  }
  var obs = new MutationObserver(scan);
  obs.observe(document.documentElement, { childList: true, subtree: true });
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", scan);
  else scan();
})();
</script>

<style>
  #ts-assist-root{position:fixed;right:16px;bottom:16px;z-index:9999;font-family:"DM Sans",system-ui,sans-serif}
  #ts-assist-fab{display:flex;align-items:center;gap:10px;border:0;cursor:pointer;background:#004741;color:#f4f7f6;padding:12px 16px;border-radius:999px;box-shadow:0 10px 30px rgba(0,40,36,.35);font:600 14px/1 "DM Sans",system-ui,sans-serif;letter-spacing:.01em}
  #ts-assist-fab:hover{background:#0a5c54}
  #ts-assist-fab svg{flex:0 0 auto}
  #ts-assist-panel{display:none;position:absolute;right:0;bottom:58px;width:min(360px,calc(100vw - 32px));height:min(480px,70vh);background:linear-gradient(165deg,#f7faf9 0%,#e8f1ef 55%,#dceae7 100%);border:1px solid rgba(0,71,65,.12);border-radius:18px;box-shadow:0 18px 50px rgba(0,30,28,.28);overflow:hidden;flex-direction:column;isolation:isolate}
  #ts-assist-panel.open{display:flex}
  #ts-assist-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 14px 10px;background:#004741;color:#f4f7f6;position:relative;z-index:2;flex:0 0 auto}
  #ts-assist-head strong{font-size:14px;font-weight:700}
  #ts-assist-head span{display:block;font-size:11px;opacity:.8;font-weight:500;margin-top:2px}
  #ts-assist-head .ts-actions{display:flex;gap:6px;align-items:center}
  #ts-assist-head a,#ts-assist-head button{appearance:none;border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:7px 10px;font:600 11px/1 "DM Sans",system-ui,sans-serif;cursor:pointer;text-decoration:none}
  #ts-assist-head a[hidden],#ts-wa-btn[hidden]{display:none!important}
  #ts-assist-msgs{flex:1 1 auto;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
  .ts-bubble{max-width:88%;padding:9px 12px;border-radius:14px;font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .ts-bubble.bot{align-self:flex-start;background:#fff;color:#143532;border:1px solid rgba(0,71,65,.08)}
  .ts-bubble.user{align-self:flex-end;background:#004741;color:#f4f7f6}
  .ts-bubble.err{align-self:flex-start;background:#fff4f2;color:#7a2e22;border:1px solid rgba(160,60,40,.2)}
  #ts-assist-form{display:flex;gap:8px;padding:10px;border-top:1px solid rgba(0,71,65,.1);background:rgba(255,255,255,.65);backdrop-filter:blur(6px);flex:0 0 auto;position:relative;z-index:2}
  #ts-assist-form input{flex:1;border:1px solid rgba(0,71,65,.18);border-radius:12px;padding:10px 12px;font:500 13px/1.3 "DM Sans",system-ui,sans-serif;background:#fff;color:#143532}
  #ts-assist-form button{border:0;border-radius:12px;padding:0 14px;background:#004741;color:#fff;font:700 13px/1 "DM Sans",system-ui,sans-serif;cursor:pointer}
  #ts-assist-form button:disabled{opacity:.55;cursor:wait}
  @media (max-width:480px){#ts-assist-fab span{display:none}#ts-assist-fab{padding:14px}}
</style>
<div id="ts-assist-root" aria-live="polite">
  <div id="ts-assist-panel" role="dialog" aria-label="Trade Square Mall assistant">
    <div id="ts-assist-head">
      <div>
        <strong>Trade Square</strong>
        <span>Ask about shops, dine, hours &amp; space</span>
      </div>
      <div class="ts-actions">
        <a id="ts-wa-btn" hidden href="#" target="_blank" rel="noopener noreferrer">WhatsApp</a>
        <button type="button" id="ts-assist-close" aria-label="Close chat">Close</button>
      </div>
    </div>
    <div id="ts-assist-msgs"></div>
    <form id="ts-assist-form">
      <input id="ts-assist-input" type="text" maxlength="2000" placeholder="e.g. shops on ground floor" autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>
  <button type="button" id="ts-assist-fab" aria-expanded="false" aria-controls="ts-assist-panel">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6.8A2.8 2.8 0 0 1 6.8 4h10.4A2.8 2.8 0 0 1 20 6.8v7.4a2.8 2.8 0 0 1-2.8 2.8H9.2L4 20.2V6.8Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 9.2h8M8 12.4h5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    <span>Ask the mall</span>
  </button>
</div>
<script>
(function () {
  var panel = document.getElementById("ts-assist-panel");
  var fab = document.getElementById("ts-assist-fab");
  var closeBtn = document.getElementById("ts-assist-close");
  var form = document.getElementById("ts-assist-form");
  var input = document.getElementById("ts-assist-input");
  var msgs = document.getElementById("ts-assist-msgs");
  var waBtn = document.getElementById("ts-wa-btn");
  var started = false;

  function bubble(text, cls) {
    var el = document.createElement("div");
    el.className = "ts-bubble " + cls;
    el.textContent = text;
    msgs.appendChild(el);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function openPanel() {
    panel.classList.add("open");
    fab.setAttribute("aria-expanded", "true");
    if (!started) {
      started = true;
      bubble("Hi — I can help with the shop directory, dining, hours, events, and available space at Trade Square Mall.", "bot");
    }
    setTimeout(function () { input.focus(); }, 50);
  }
  function closePanel() {
    panel.classList.remove("open");
    fab.setAttribute("aria-expanded", "false");
  }

  fab.addEventListener("click", function () {
    if (panel.classList.contains("open")) closePanel();
    else openPanel();
  });
  closeBtn.addEventListener("click", closePanel);

  fetch("/api/config").then(function (r) { return r.json(); }).then(function (cfg) {
    if (cfg && cfg.whatsapp && cfg.whatsapp.link) {
      waBtn.href = cfg.whatsapp.link;
      waBtn.hidden = false;
    }
  }).catch(function () {});

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var text = (input.value || "").trim();
    if (!text) return;
    input.value = "";
    bubble(text, "user");
    var btn = form.querySelector("button");
    btn.disabled = true;
    fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (res.ok && res.j.reply) bubble(res.j.reply, "bot");
        else bubble(res.j.error || "Sorry — chat is unavailable right now.", "err");
      })
      .catch(function () { bubble("Network error — please try again.", "err"); })
      .finally(function () { btn.disabled = false; input.focus(); });
  });
})();
</script>

  </body>
</html>
