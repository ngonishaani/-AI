# Trade Square Mall on Render
# - Web service: WhatsApp bot + mall website (/, /shop, /enroll, assets)
# - Site files ship in bot/public (works with rootDir: bot)
# - Catalog API: GET/PUT /catalog (same origin as the site)
# Dashboard: New → Blueprint → connect this repo → apply render.yaml
# Docs: docs/render-deploy.md  ·  Requires a paid plan for persistent disk + always-on

services:
  - type: web
    name: trade-square-whatsapp-bot
    runtime: node
    plan: starter
    region: oregon
    rootDir: bot
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: baileys-auth
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: BAILEYS_AUTH_DIR
        value: /var/data/auth_info_baileys
      - key: SITE_ROOT
        value: /opt/render/project/src/public
      - key: LOG_LEVEL
        value: info
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: BOT_ALLOW_GROUPS
        value: "0"
      - key: CATALOG_SYNC_TOKEN
        sync: false
