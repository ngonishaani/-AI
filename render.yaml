# Trade Square Mall on Render
# - Web service: WhatsApp bot + mall website (/, /shop, /enroll, assets)
# - Cron job: pings /health every 5 minutes so the bot stays awake
# - Site files ship in bot/public (works with rootDir: bot)
# Docs: docs/render-deploy.md  ·  Prefer Starter+ so WhatsApp never sleeps

services:
  - type: web
    name: trade-square-whatsapp-bot
    runtime: node
    plan: starter
    region: oregon
    rootDir: bot
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: baileys-auth
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: BAILEYS_AUTH_DIR
        value: /var/data/auth_info_baileys
      - key: SITE_ROOT
        value: /opt/render/project/src/public
      - key: KEEP_ALIVE_URL
        value: https://ai-mallbot.onrender.com/health
      - key: LOG_LEVEL
        value: info
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: BOT_ALLOW_GROUPS
        value: "0"
      - key: CATALOG_SYNC_TOKEN
        sync: false

  # External keep-alive: wakes / verifies the web service every 5 minutes.
  # Apply via Blueprint sync, or create Cron Job manually with the same command.
  - type: cron
    name: trade-square-bot-keepalive
    runtime: node
    plan: starter
    region: oregon
    rootDir: bot
    schedule: "*/5 * * * *"
    buildCommand: "true"
    startCommand: node scripts/keep-alive.mjs
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: KEEP_ALIVE_URL
        value: https://ai-mallbot.onrender.com/health
